<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CitaDiaria - El Juego Bíblico</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="game-container">
        
        <!-- Cabecera -->
        <header>
            <div class="header-side">
                <button id="help-btn" class="icon-btn" aria-label="Cómo jugar">?</button>
            </div>
            <h1>CITA<span class="highlight">DIARIA</span></h1>
            <div class="header-side">
                <button id="stats-btn" class="icon-btn" aria-label="Estadísticas">📊</button>
            </div>
        </header>

        <!-- Indicador de Progreso / Intentos -->
        <section id="progress-container">
            <div class="attempts-indicator">
                <span class="attempt-pill" data-attempt="1"></span>
                <span class="attempt-pill" data-attempt="2"></span>
                <span class="attempt-pill" data-attempt="3"></span>
                <span class="attempt-pill" data-attempt="4"></span>
                <span class="attempt-pill" data-attempt="5"></span>
            </div>
            <p id="intentos-restantes">Intento 1 de 5</p>
        </section>

        <!-- Área de la Cita (Donde van apareciendo las palabras) -->
        <main id="quote-container">
            <div class="verse-card">
                <span class="quote-mark">“</span>
                <p id="verse-text" class="verse-text">
                    <!-- Aquí JS insertará las palabras visibles según el intento -->
                    <span class="revealed-word">Porque</span> 
                    <span class="hidden-word">...</span>
                </p>
                <span class="quote-mark">”</span>
            </div>
        </main>

        <!-- Historial de Intentos Fallidos -->
        <section id="guesses-history">
            <!-- JS insertará aquí las respuestas previas del usuario con su feedback -->
            <!-- Ejemplo de cómo se verá: 
            <div class="guess-item wrong">❌ Mateo 5:16</div> 
            -->
        </section>

        <!-- Área de Respuesta del Usuario -->
        <footer id="input-container">
            <form id="guess-form" autocomplete="off">
                <div class="input-wrapper">
                    <input 
                        type="text" 
                        id="verse-input" 
                        placeholder="Ej: Juan 3:16 o Salmos 23:1" 
                        required
                    >
                    <button type="submit" id="submit-btn">ENVIAR</button>
                </div>
            </form>
            <div id="toast-message" class="toast hidden"></div>
        </footer>

    </div>

    <script src="script.js"></script>
</body>
</html>
